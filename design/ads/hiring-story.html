<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="ad-size" content="1080x1920">
<title>التوصيل السريع — نحتاج مناديب توصيل</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{
    --brand:#F04E23;      /* block red-orange: field, stamp stripe, CTA bar — nothing else */
    --brand-ink:#111111;  /* ink black */
    --accent:#F04E23;     /* single accent = brand */
    --bg:#F3EDE0;         /* paper cream */
    --fg:#111111;
    --m:70px;             /* outer margin */
    --paper-w:260px;      /* cream block width */
    --band-top:1210px;    /* where the red field ends */
    --paper-h:300px;      /* ink/cream band height (story) */
  }
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:'Changa','Cairo',sans-serif;-webkit-font-smoothing:antialiased;}
  *{box-sizing:border-box;letter-spacing:0}
  .ltr{direction:ltr;unicode-bidi:isolate}

  /* ---- blocks ---- */
  .red{position:absolute;inset:0 0 auto 0;height:var(--band-top);background:var(--brand);}
  .ink{position:absolute;left:var(--paper-w);right:0;top:var(--band-top);height:var(--paper-h);background:var(--brand-ink);}
  .ground{position:absolute;left:0;right:0;top:calc(var(--band-top) + var(--paper-h));bottom:0;background:var(--bg);overflow:hidden}
  .paper{position:absolute;left:0;width:var(--paper-w);top:var(--band-top);height:var(--paper-h);background:var(--bg);}
  .skyline{position:absolute;left:0;right:0;bottom:0;height:210px;opacity:.18}
  .skyline svg{fill:var(--brand-ink)}
  .skyline svg{width:100%;height:100%;display:block}

  /* ---- header: stamp wordmark + tagline ---- */
  .brand{position:absolute;top:290px;right:var(--m);display:flex;align-items:center;gap:18px;color:var(--fg);}
  .brand svg{width:64px;height:64px;display:block}
  .brand .name{font:800 50px/1.15 'Changa';white-space:nowrap}
  .tag{position:absolute;top:362px;right:var(--m);font:700 34px/1.3 'Cairo';color:var(--fg);white-space:nowrap}

  /* ---- headline: three stacked words, one column on the right ---- */
  .hl{position:absolute;right:var(--m);top:470px;text-align:right;color:var(--fg);font:800 146px/1.15 'Changa'}
  .hl div{white-space:nowrap}

  /* ---- hero: the helmet — the job, seen before the first shift ---- */
  .hero{position:absolute;left:var(--m);top:522px;width:452px}
  .hero svg{width:100%;height:auto;display:block;overflow:visible}

  /* ---- decal stuck on the helmet dome: the one thing a first-timer asks ---- */
  .sticker{position:absolute;left:174px;top:590px;width:244px;padding:8px 22px 10px;background:var(--brand-ink);color:var(--bg);
    transform:rotate(-7deg);transform-origin:50% 50%;text-align:center}
  .sticker .v{font:800 52px/1.2 'Changa';white-space:nowrap}

  /* ---- support: earnings chip + conditions ---- */
  .sup{position:absolute;right:var(--m);top:1012px;text-align:right;color:var(--fg);font:700 40px/1.3 'Cairo';white-space:nowrap}
  .sup .row{display:flex;align-items:center;gap:20px;justify-content:flex-start}
  .sup .row + .row{margin-top:14px}
  .sup .dot{font-size:48px;line-height:1}
  .sup .tagp{background:var(--bg);padding:6px 22px 8px;line-height:1.2}

  /* ---- bottom band: CTA bar + phone ---- */
  .cta{position:absolute;right:var(--m);left:calc(var(--paper-w) + 56px);top:1252px;height:96px;
    display:flex;align-items:center;gap:14px;background:var(--accent);color:var(--fg);padding:0 30px 0 26px;white-space:nowrap}
  .cta .t{font:800 52px/1 'Changa';margin-top:-4px}
  .cta .sp{flex:1}
  .cta .wa{display:flex;align-items:center;gap:12px;font:700 34px/1 'Cairo'}
  .cta .wa svg{width:46px;height:46px;display:block}
  .phone{position:absolute;right:var(--m);top:1366px;color:var(--bg);font:800 92px/1.05 'Changa';white-space:nowrap}

  /* ---- ID badge mark in the cream block ---- */
  .mark{position:absolute;left:0;width:var(--paper-w);top:var(--band-top);height:var(--paper-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding-bottom:6px}
  .mark svg{width:144px;height:144px;display:block}
  .mark .cap{font:700 36px/1.3 'Cairo';color:var(--fg);white-space:nowrap}
</style>
</head>
<body>
  <div class="red"></div>
  <div class="ink"></div>
  <div class="ground">
    <!-- Baghdad skyline, low opacity: Jadriya bridge, palms, dome and minarets -->
    <div class="skyline">
      <svg viewBox="0 0 780 120" preserveAspectRatio="xMidYMax meet" aria-hidden="true" fill="var(--bg)">
        <rect x="0" y="86" width="250" height="8"/>
        <rect x="46" y="26" width="8" height="70"/><rect x="176" y="26" width="8" height="70"/>
        <path d="M0 48 Q50 26 50 26 Q113 70 180 26 Q215 26 250 60 V64 Q215 32 180 32 Q113 76 50 32 Q20 38 0 54Z"/>
        <path d="M50 30 V86 M70 44 V86 M90 56 V86 M110 64 V86 M130 62 V86 M150 54 V86 M170 40 V86 M200 36 V86 M220 46 V86 M240 58 V86" stroke="var(--bg)" stroke-width="2.5" fill="none"/>
        <rect x="286" y="60" width="5" height="40"/>
        <path d="M288 62c-20-4-34-14-38-30 15 2 27 10 38 24 11-14 23-22 38-24-4 16-18 26-38 30z"/>
        <path d="M288 63c-10-10-14-24-10-38 7 9 11 21 10 38-1-17 3-29 10-38 4 14 0 28-10 38z"/>
        <rect x="334" y="70" width="5" height="30"/>
        <path d="M336 72c-16-3-27-11-30-24 12 2 21 8 30 19 9-11 18-17 30-19-3 13-14 21-30 24z"/>
        <rect x="360" y="52" width="44" height="50"/><rect x="412" y="66" width="30" height="36"/>
        <path d="M470 102V74c0-30 56-30 56 0v28z"/>
        <path d="M462 102V36l5-10 5 10v66zM524 102V36l5-10 5 10v66z"/>
        <path d="M600 102V70c0-22-26-28-34-10-6 14-10 28-10 42z"/>
        <path d="M612 102c0-14-4-28-10-42-8-18-34-12-34 10v32z"/>
        <rect x="632" y="44" width="36" height="58"/><rect x="676" y="58" width="28" height="44"/>
        <rect x="716" y="30" width="6" height="72"/><circle cx="719" cy="26" r="7"/>
        <rect x="736" y="64" width="44" height="38"/>
        <rect x="0" y="100" width="780" height="20"/>
      </svg>
    </div>
  </div>
  <div class="paper"></div>

  <!-- wordmark: perforated ink stamp, brand-stripe cut, RTL forward arrow -->
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <mask id="perf">
          <rect width="64" height="64" fill="#fff"/>
          <g fill="#000">
            <circle cx="0" cy="8" r="4"/><circle cx="0" cy="20" r="4"/><circle cx="0" cy="32" r="4"/><circle cx="0" cy="44" r="4"/><circle cx="0" cy="56" r="4"/>
            <circle cx="64" cy="8" r="4"/><circle cx="64" cy="20" r="4"/><circle cx="64" cy="32" r="4"/><circle cx="64" cy="44" r="4"/><circle cx="64" cy="56" r="4"/>
            <circle cx="8" cy="0" r="4"/><circle cx="20" cy="0" r="4"/><circle cx="32" cy="0" r="4"/><circle cx="44" cy="0" r="4"/><circle cx="56" cy="0" r="4"/>
            <circle cx="8" cy="64" r="4"/><circle cx="20" cy="64" r="4"/><circle cx="32" cy="64" r="4"/><circle cx="44" cy="64" r="4"/><circle cx="56" cy="64" r="4"/>
            <rect x="0" y="42" width="64" height="10"/>
          </g>
        </mask>
      </defs>
      <rect width="64" height="64" fill="var(--brand-ink)" mask="url(#perf)"/>
      <rect x="0" y="42" width="64" height="10" fill="var(--brand)"/>
      <path d="M48 25H18" stroke="var(--bg)" stroke-width="6" stroke-linecap="round"/>
      <path d="M27 15 17 25l10 10" stroke="var(--bg)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <div class="name">التوصيل السريع</div>
  </div>
  <div class="tag">دليفري داخل بغداد وللمحافظات</div>

  <!-- headline -->
  <div class="hl">
    <div>نحتاج</div>
    <div>مناديب</div>
    <div>توصيل</div>
  </div>

  <!-- hero: open-face courier helmet, facing forward (left), cream shell on the red field -->
  <div class="hero">
    <svg viewBox="0 0 400 360" aria-hidden="true">
      <!-- shell: dome, back comes down, face opening at the front -->
      <path d="M30 200A170 170 0 0 1 370 200V292Q370 322 340 322H236Q204 322 204 290V236Q204 204 172 204H30Z" fill="var(--bg)"/>
      <!-- visor peak -->
      <path d="M206 198H44Q8 204 10 220Q12 234 46 234H206Z" fill="var(--brand-ink)"/>
      <!-- face shield: one line that closes the opening -->
      <path d="M64 240Q46 300 98 334Q146 360 204 346" stroke="var(--brand-ink)" stroke-width="11" stroke-linecap="round" fill="none"/>
      <!-- shield pivot bolt -->
      <circle cx="290" cy="244" r="17" fill="var(--brand-ink)"/>
    </svg>
  </div>

  <!-- decal on the helmet: no experience needed -->
  <div class="sticker">
    <div class="v">بدون خبرة</div>
  </div>

  <!-- support -->
  <div class="sup">
    <div class="row"><span class="tagp">راتب أسبوعي + حوافز يومية</span></div>
    <div class="row"><span>دوام مرن</span><span class="dot">·</span><span>بغداد</span></div>
  </div>

  <!-- CTA bar: apply now + WhatsApp -->
  <div class="cta">
    <span class="t">قدّم هسه</span>
    <span class="sp"></span>
    <span class="wa">
      <span>واتساب</span>
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 4C13 4 4 12.8 4 23.7c0 3.9 1.1 7.5 3.1 10.6L4 44l10-2.9c2.9 1.6 6.4 2.5 10 2.5 11 0 20-8.8 20-19.9S35 4 24 4z" fill="var(--fg)"/>
        <path d="M17.2 14.4c-.5-1-1-1-1.5-1h-1.3c-.4 0-1.1.2-1.7.8-.6.6-2.2 2.1-2.2 5.2s2.3 6.1 2.6 6.5c.3.4 4.4 7 10.9 9.5 5.4 2.1 6.5 1.7 7.7 1.6 1.2-.1 3.7-1.5 4.3-3 .5-1.5.5-2.7.4-3-.2-.3-.6-.4-1.2-.7-.6-.3-3.7-1.8-4.3-2-.6-.2-1-.3-1.4.3-.4.6-1.6 2-2 2.4-.4.4-.7.5-1.3.2-.6-.3-2.6-1-5-3.1-1.9-1.6-3.1-3.7-3.5-4.3-.4-.6 0-.9.3-1.2.3-.3.6-.7.9-1.1.3-.4.4-.6.6-1 .2-.4.1-.8 0-1.1-.1-.3-1.4-3.3-1.9-4.5z" fill="var(--accent)"/>
      </svg>
    </span>
  </div>
  <div class="phone ltr">0770 000 0000</div>

  <!-- ID badge mark + join caption -->
  <div class="mark">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <!-- lanyard + clip -->
      <path d="M100 8v34" stroke="var(--brand-ink)" stroke-width="10" stroke-linecap="round"/>
      <rect x="84" y="38" width="32" height="20" rx="5" fill="var(--brand-ink)"/>
      <!-- card -->
      <rect x="36" y="56" width="128" height="124" rx="12" fill="var(--brand-ink)"/>
      <!-- photo -->
      <circle cx="100" cy="102" r="22" fill="var(--bg)"/>
      <!-- name lines -->
      <rect x="60" y="136" width="80" height="10" rx="5" fill="var(--bg)"/>
      <rect x="76" y="154" width="48" height="10" rx="5" fill="var(--bg)"/>
    </svg>
    <div class="cap">انضم إلنا</div>
  </div>
</body>
</html>
